name: Build JARVIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/JARVIS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: dist/JARVIS.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JARVIS v1.0.${{ github.run_number }}
          body: "Install JARVIS.apk on your Android phone. See SETUP.md for the AI backend."
          files: dist/JARVIS.apk
          make_latest: true
